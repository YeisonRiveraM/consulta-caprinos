
name: Procesar Excel y publicar página

on:
  push:
    branches:
      - main
    paths:
      - "excel/**"
      - "scripts/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Procesar libros Excel
        run: python scripts/process_excel.py

      - name: Preparar sitio web
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
